[project]
name = "aironet"
version = "0.1.0"
description = "Cisco AireOS WLC / Mobility Express SSH helper"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["netmiko>=4.7"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
air-ssh = "air_ssh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_ssh"]

[tool.ruff]
line-length = 100
